name: Daily HK Rental Report

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (first page only, no LLM)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  schedule:
    # 00:13 HKT = 16:13 UTC (UTC+8, slightly off the hour to avoid queue spikes)
    - cron: "13 16 * * *"

permissions:
  contents: write

env:
  PYTHONPATH: hk-rental-radar/src

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: hk-rental-radar

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hk-rental-radar/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install -e .

      - name: Run full pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRAWLER_USER_AGENT: "hk-rental-radar/0.1 (+https://github.com/${{ github.repository }}; GitHub Actions)"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TZ: Asia/Hong_Kong
        run: |
          python -m hk_rental_radar.cli run \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Commit and push report
        run: |
          git config user.name "hk-rental-radar[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ data/output/ data/hk_rental_radar.db 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(rental): daily report $(TZ=Asia/Hong_Kong date +%Y-%m-%d)"
          git push origin HEAD

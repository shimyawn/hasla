[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hk-rental-radar"
version = "0.1.0"
description = "Daily Hong Kong rental report generator for a specific household profile"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "anthropic>=0.28",
    "jinja2>=3.1",
    "click>=8.1",
    "pyyaml>=6.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-beautifulsoup4>=4.12",
    "types-PyYAML>=6.0",
]

[project.scripts]
hk-rental-radar = "hk_rental_radar.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/hk_rental_radar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = ["N999", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["hk_rental_radar"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
